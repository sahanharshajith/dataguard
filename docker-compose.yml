# PostgreSQL + FastAPI backend

services:
  postgres:
    image: postgres:16
    container_name: dataguard-postgres
    restart: unless-stopped
    environment:
      # Creates the first database + owner (the DataGuard metadata DB).
      POSTGRES_USER: ${POSTGRES_USER:-dataguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-dataguard}
      # Read by docker/postgres/init/01-create-airflow-db.sh (second DB + owner).
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in your .env file}
    ports:
      # Bound to localhost only, so other machines on your network cannot reach it.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: dataguard-backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-dataguard}
      POSTGRES_HOST: postgres   # the service name is the hostname inside the Compose network
      POSTGRES_PORT: "5432"     # the container port, not the host port
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Development mode: auto-reload when you edit files in backend/app.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
