name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only need to read the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataguard
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: dataguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://dataguard:ci_password@localhost:5432/dataguard_test?connect_timeout=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run unit and integration tests
        run: pytest -v

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI-only throwaway values, not real secrets. Real secrets belong in GitHub Secrets.
      POSTGRES_PASSWORD: ci_password
      AIRFLOW_DB_PASSWORD: ci_password
      AIRFLOW_ADMIN_PASSWORD: ci_password
      AIRFLOW_JWT_SECRET: ci-only-value-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Compose file
        run: docker compose config --quiet
      - name: Build the backend and frontend images
        run: docker compose build backend frontend
      - name: Start PostgreSQL and the backend
        run: docker compose up -d --wait postgres backend
      - name: Apply migrations inside the container
        run: docker compose exec -T backend alembic upgrade head
      - name: Check that the API can reach the database
        run: curl --fail --silent --show-error http://localhost:8000/health/db
      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs --no-color
      - name: Shut everything down
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (includes the TypeScript type check)
        run: npm run build